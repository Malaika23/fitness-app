services:
  db:
    container_name: postgres-spring-boot
    image: postgres:latest
    environment:
      POSTGRES_USER: amigoscode
      POSTGRES_PASSWORD: password
      POSTGRES_DB: fitness_user_db
      PGDATA: /data/postgres
    volumes:
      - db_data:/data/postgres
    ports:
      - "5332:5432"
    networks:
      - fitness-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amigoscode -d fitness_user_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    container_name: mongodb-activity-service
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - fitness-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    container_name: rabbitmq-fitness
    image: rabbitmq:4-management
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - fitness-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  keycloak:
    container_name: keycloak-fitness
    image: quay.io/keycloak/keycloak:26.7.0
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
    command: start-dev
    ports:
      - "8181:8080"
    networks:
      - fitness-net
    restart: unless-stopped

  configserver:
    container_name: configserver-fitness
    build: ./configserver
    ports:
      - "8888:8888"
    networks:
      - fitness-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8888"]
      interval: 5s
      timeout: 5s
      retries: 10

  eureka:
    container_name: eureka-fitness
    build: ./eureka
    ports:
      - "8761:8761"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configserver:8888
    depends_on:
      configserver:
        condition: service_healthy
    networks:
      - fitness-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8761"]
      interval: 5s
      timeout: 5s
      retries: 10

  userservice:
    container_name: userservice-fitness
    build: ./userservice
    ports:
      - "8081:8081"
      - "9091:9091"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configserver:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/fitness_user_db?options=-c%20TimeZone%3DUTC
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started
      eureka:
        condition: service_healthy
    networks:
      - fitness-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8081"]
      interval: 5s
      timeout: 5s
      retries: 10

  activityservice:
    container_name: activityservice-fitness
    build: ./activityservice
    ports:
      - "8082:8082"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configserver:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_MONGODB_URI=mongodb://mongodb:27017/fitness_activity_db
      - RABBITMQ_HOST=rabbitmq
      - GRPC_CLIENT_USERSERVICE_ADDRESS=static://userservice:9091
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka:
        condition: service_healthy
    networks:
      - fitness-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8082"]
      interval: 5s
      timeout: 5s
      retries: 10

  aiservice:
    container_name: aiservice-fitness
    build: ./aiservice
    ports:
      - "8083:8083"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configserver:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_MONGODB_URI=mongodb://mongodb:27017/fitnessRecommendation
      - RABBITMQ_HOST=rabbitmq
      - GEMINI_API_URL=${GEMINI_API_URL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka:
        condition: service_healthy
    networks:
      - fitness-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8083"]
      interval: 5s
      timeout: 5s
      retries: 10

  gateway:
    container_name: gateway-fitness
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_CONFIG_IMPORT=optional:configserver:http://configserver:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://keycloak:8080/realms/fitness-oauth2/protocol/openid-connect/certs
    depends_on:
      keycloak:
        condition: service_healthy
      eureka:
        condition: service_healthy
    networks:
      - fitness-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8080"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  fitness-net:
    driver: bridge

volumes:
  db_data:
  mongodb_data:
