server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Gateway MVC Routes (Servlet-based)
spring.cloud.gateway.mvc.routes[0].id=user-service-mvc
spring.cloud.gateway.mvc.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/user/**

spring.cloud.gateway.mvc.routes[1].id=activity-service-mvc
spring.cloud.gateway.mvc.routes[1].uri=lb://ACTIVITYSERVICE
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/activities/**

spring.cloud.gateway.mvc.routes[2].id=ai-service-mvc
spring.cloud.gateway.mvc.routes[2].uri=lb://AISERVICE
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/recommendation/**

# Standard Gateway Routes (WebFlux fallback)
spring.cloud.gateway.server.webflux.routes[0].id=user-service-reactive
spring.cloud.gateway.server.webflux.routes[0].uri=lb://USER-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/user/**

spring.cloud.gateway.server.webflux.routes[1].id=activity-service-reactive
spring.cloud.gateway.server.webflux.routes[1].uri=lb://ACTIVITYSERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/activities/**

spring.cloud.gateway.server.webflux.routes[2].id=ai-service-reactive
spring.cloud.gateway.server.webflux.routes[2].uri=lb://AISERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/recommendation/**
